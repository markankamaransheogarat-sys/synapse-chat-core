[package]
name = "synapse-chat-core"
version = "0.1.0"
edition = "2021"
authors = ["Konstantin <markankamaransheogarat-sys@users.noreply.github.com>"]
description = "⚡ High-Concurrency Distributed Chat Gateway & Offline-First CRDT Engine in Rust"
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
